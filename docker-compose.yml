services:

  nginx:
    image: nginx:1.27-alpine
    container_name: sd-nginx
    ports:
      - "8088:80"
    depends_on:
      - app
    networks:
      - public-net
      - internal-net
    restart: unless-stopped
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/limit.conf:/etc/nginx/conf.d/limit.conf:ro

  app:
    build: ./app
    container_name: sd-app
    expose:
      - "5000"
    depends_on:
      - postgres
      - redis
    networks:
      - internal-net
    restart: unless-stopped
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    secrets:
      - db_password

  postgres:
    image: postgres:16-alpine
    container_name: sd-postgres
    environment:
      POSTGRES_DB: secureapp
      POSTGRES_USER: secureuser
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal-net
    restart: unless-stopped
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    secrets:
      - db_password

  redis:
    image: redis:7-alpine
    container_name: sd-redis
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./redis/config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - internal-net
    restart: unless-stopped
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true

networks:
  public-net:
  internal-net:
    internal: true

volumes:
  postgres-data:

secrets:
  db_password:
    file: ./secrets/db_password.txt
